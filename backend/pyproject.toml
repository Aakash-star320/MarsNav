[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marsnav-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.13,<1.14", "httpx>=0.27,<0.28",
  "numpy>=2.0,<3", "scipy>=1.11", "pyproj>=3.6,<3.7", "shapely>=2.0,<2.1"
]
[project.optional-dependencies]
geo = ["rasterio>=1.3,<1.5", "xarray>=2024.6", "geopandas>=1.0,<1.1"]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: needs network; enable with RUN_REAL_DATA=1"]
[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
include = ["app*"]
