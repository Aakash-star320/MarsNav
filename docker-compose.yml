services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marsnav
      POSTGRES_USER: marsnav
      POSTGRES_PASSWORD: marsnav
    ports: ["5432:5432"]
    volumes: [marsnav_postgres:/var/lib/postgresql/data]
  api:
    profiles: [api]
    build: ./backend
    env_file: .env
    volumes: [./backend:/app, ./data:/data]
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  marsnav_postgres:
